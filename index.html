<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLUB TAISENCARD</title>
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f2f5;
            color: #333;
            text-align: center;
            box-sizing: border-box;
        }
        h1 { font-size: 20px; color: #1a365d; margin-bottom: 20px; }
        
        /* 📝 入力エリア */
        .input-area {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 0 auto 30px auto;
        }
        .input-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        label { font-weight: bold; font-size: 14px; }
        input {
            width: 65%;
            padding: 8px;
            font-size: 16px;
            border: 1px solid #cbd5e0;
            border-radius: 5px;
        }
        button {
            width: 100%;
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }

        /* 📸 カメラ撮影用の表示エリア */
        .display-area {
            background-color: #0f172a;
            color: #ffffff;
            padding: 40px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
            max-width: 500px;
            margin: 0 auto 50px auto;
            transition: all 0.3s ease;
        }
        .match-num {
            font-size: 26px;
            color: #fbd38d;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        .teams {
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 42px;
            font-weight: bold;
            width: 100%;
        }
        .vs {
            font-size: 24px;
            color
